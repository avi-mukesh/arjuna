# REAL MONEY. Live trading needs ALL THREE of:
#   1. ARJUNA_ENV=live
#   2. the --confirm-live CLI flag
#   3. live.enabled: true below
# Only Avi changes `enabled`. Tests assert it is false in the committed file.
env: live
broker: alpaca_live
live:
  enabled: false
risk:
  max_order_notional: 1000     # placeholder for "small fixed capital"; Avi to set before Phase 8
  max_daily_turnover: 0.5
  initial_deployment_max_turnover: 1.0   # one-off build from cash only (ADR 0002)
  max_gross_leverage: 1.0
  reconcile_tolerance: 0.01
