[project]
name = "arjuna"
version = "0.1.0"
description = "Focused, low-turnover systematic trading: multi-asset trend following with volatility targeting."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "typer>=0.12",
]

[project.scripts]
arjuna = "arjuna.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arjuna"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "N",       # pep8-naming
    "PT",      # pytest style
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# Paper-broker tests are skipped by default. `pytest -m paper` overrides this,
# because pytest uses the last -m it sees.
addopts = ["-ra", "--strict-markers", "-m", "not paper"]
markers = [
    "paper: integration tests that talk to the Alpaca *paper* API (needs credentials; skipped by default)",
]
